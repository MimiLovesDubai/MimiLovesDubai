<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><style>html,body{margin:0;padding:0;background:#111}canvas{display:block}</style></head>
<body>
<canvas id="c" width="2400" height="3000"></canvas>
<script>
// Deterministic seeded RNG (mulberry32)
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const qp=new URLSearchParams(location.search);
const piece=qp.get('piece')||'delft';
let W=canvas.width,H=canvas.height;

function setSize(w,h){canvas.width=w;canvas.height=h;W=w;H=h;}

// ---------- shared helpers ----------
function grain(alpha,seed){
  const r=rng(seed);const n=Math.floor(W*H/900);
  for(let i=0;i<n;i++){const x=r()*W,y=r()*H,a=r()*alpha;
    ctx.fillStyle='rgba('+(r()>0.5?'255,255,255':'0,0,0')+','+a+')';
    ctx.fillRect(x,y,1.5,1.5);}
}
function vignette(strength){
  const g=ctx.createRadialGradient(W/2,H/2,H*0.25,W/2,H/2,H*0.75);
  g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,'+strength+')');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}
// canal house silhouette path (three gable types), h = height, w = width
function housePath(x,base,w,h,type){
  ctx.beginPath();
  if(type===0){ // step gable
    const steps=5,sw=w/2/steps,sh=h*0.45/steps;
    ctx.moveTo(x,base);ctx.lineTo(x,base-h*0.55);
    for(let i=0;i<steps;i++){ctx.lineTo(x+i*sw,base-h*0.55-(i)*sh);ctx.lineTo(x+(i+1)*sw,base-h*0.55-(i)*sh);}
    ctx.lineTo(x+w/2,base-h);
    for(let i=steps-1;i>=0;i--){ctx.lineTo(x+w-(i+1)*sw,base-h*0.55-(i)*sh);ctx.lineTo(x+w-i*sw,base-h*0.55-(i)*sh);}
    ctx.lineTo(x+w,base-h*0.55);ctx.lineTo(x+w,base);
  } else if(type===1){ // bell gable
    ctx.moveTo(x,base);ctx.lineTo(x,base-h*0.6);
    ctx.bezierCurveTo(x+w*0.05,base-h*0.75,x+w*0.28,base-h*0.72,x+w*0.32,base-h*0.9);
    ctx.quadraticCurveTo(x+w*0.4,base-h*1.02,x+w*0.5,base-h*1.02);
    ctx.quadraticCurveTo(x+w*0.6,base-h*1.02,x+w*0.68,base-h*0.9);
    ctx.bezierCurveTo(x+w*0.72,base-h*0.72,x+w*0.95,base-h*0.75,x+w,base-h*0.6);
    ctx.lineTo(x+w,base);
  } else { // neck gable
    ctx.moveTo(x,base);ctx.lineTo(x,base-h*0.62);ctx.lineTo(x+w*0.3,base-h*0.62);
    ctx.lineTo(x+w*0.3,base-h*0.95);
    ctx.quadraticCurveTo(x+w*0.5,base-h*1.08,x+w*0.7,base-h*0.95);
    ctx.lineTo(x+w*0.7,base-h*0.62);ctx.lineTo(x+w,base-h*0.62);ctx.lineTo(x+w,base);
  }
  ctx.closePath();
}

// ---------- PIECE 1: DELFT FLOW ----------
function delft(){
  const r=rng(20261717);
  // ivory ground with subtle paper wash
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#F7F2E9');bg.addColorStop(0.6,'#F3EDE1');bg.addColorStop(1,'#EDE5D5');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  // flowing cobalt ribbons (flow field)
  const blues=['#12306B','#1E4FA3','#2B6BC4','#0E2450','#3E7ED4'];
  for(let k=0;k<170;k++){
    let x=r()*W, y=r()*H*0.9+H*0.05;
    const col=blues[Math.floor(r()*blues.length)];
    const lw=1+Math.pow(r(),2)*26;
    ctx.strokeStyle=col;ctx.globalAlpha=0.10+r()*0.5;ctx.lineWidth=lw;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(x,y);
    const steps=40+Math.floor(r()*80);
    for(let i=0;i<steps;i++){
      const a=Math.sin(x*0.0016+y*0.0011)+Math.cos(y*0.0019-x*0.0007)*1.2;
      x+=Math.cos(a)*14; y+=Math.sin(a)*14+1.5;
      ctx.lineTo(x,y);
    }
    ctx.stroke();ctx.globalAlpha=1;
  }
  // porcelain plate fragments
  for(let k=0;k<7;k++){
    const cx=r()*W, cy=r()*H*0.55+H*0.06, rad=90+r()*230;
    ctx.save();ctx.translate(cx,cy);ctx.rotate(r()*Math.PI);
    ctx.beginPath();ctx.arc(0,0,rad,r()*1.2,Math.PI*(1.05+r()*0.85));
    ctx.strokeStyle='#12306B';ctx.lineWidth=8+r()*14;ctx.globalAlpha=0.75;ctx.stroke();
    ctx.beginPath();ctx.arc(0,0,rad*0.82,r()*1.2,Math.PI*(1.0+r()*0.8));
    ctx.lineWidth=3+r()*5;ctx.globalAlpha=0.55;ctx.stroke();
    ctx.restore();ctx.globalAlpha=1;
  }
  // botanical dots and leaves
  for(let k=0;k<260;k++){
    const x=r()*W,y=r()*H*0.92,s=2+r()*9;
    ctx.fillStyle=blues[Math.floor(r()*blues.length)];
    ctx.globalAlpha=0.25+r()*0.55;
    ctx.beginPath();ctx.ellipse(x,y,s,s*(0.4+r()*0.6),r()*Math.PI,0,7);ctx.fill();
    ctx.globalAlpha=1;
  }
  // canal house skyline at base in deep cobalt
  ctx.fillStyle='#0E2450';
  const n=9;let x=-60;
  const baseY=H*0.985;
  for(let i=0;i<n;i++){
    const w=W/n*1.12,h=H*(0.16+r()*0.10);
    housePath(x,baseY,w*0.92,h,i%3);ctx.globalAlpha=0.92;ctx.fill();ctx.globalAlpha=1;
    x+=w*0.94;
  }
  // platinum leaf accents
  for(let k=0;k<26;k++){
    const x=r()*W,y=r()*H*0.75,s=8+r()*30;
    const g=ctx.createLinearGradient(x-s,y-s,x+s,y+s);
    g.addColorStop(0,'#EAE6DC');g.addColorStop(0.5,'#CFC8B8');g.addColorStop(1,'#B8AF9C');
    ctx.fillStyle=g;ctx.globalAlpha=0.8;
    ctx.beginPath();ctx.ellipse(x,y,s,s*0.62,r()*Math.PI,0,7);ctx.fill();ctx.globalAlpha=1;
  }
  grain(0.05,7);vignette(0.10);
}

// ---------- PIECE 2: TULIPOMANIA ----------
function tulipBloom(cx,cy,hgt,wid,lean,c1,c2,c3,shimmer){
  ctx.save();ctx.translate(cx,cy);ctx.rotate(lean);
  const grad=(a,b)=>{const g=ctx.createLinearGradient(0,0,0,-hgt);g.addColorStop(0,a);g.addColorStop(1,b);return g;};
  // back petals (left & right, tips flare slightly outward)
  ctx.fillStyle=grad(c3,c2);ctx.globalAlpha=0.95;
  ctx.beginPath();ctx.moveTo(0,0);
  ctx.bezierCurveTo(-wid*1.05,-hgt*0.30,-wid*0.95,-hgt*0.72,-wid*0.55,-hgt*0.98);
  ctx.quadraticCurveTo(-wid*0.42,-hgt*0.80,-wid*0.18,-hgt*0.62);
  ctx.quadraticCurveTo(-wid*0.3,-hgt*0.3,0,0);ctx.fill();
  ctx.beginPath();ctx.moveTo(0,0);
  ctx.bezierCurveTo(wid*1.05,-hgt*0.30,wid*0.95,-hgt*0.72,wid*0.55,-hgt*0.98);
  ctx.quadraticCurveTo(wid*0.42,-hgt*0.80,wid*0.18,-hgt*0.62);
  ctx.quadraticCurveTo(wid*0.3,-hgt*0.3,0,0);ctx.fill();
  // center petal — tall cup with pointed tip
  ctx.fillStyle=grad(c1,c2);ctx.globalAlpha=1;
  ctx.beginPath();ctx.moveTo(-wid*0.62,-hgt*0.18);
  ctx.bezierCurveTo(-wid*0.72,-hgt*0.55,-wid*0.35,-hgt*0.88,0,-hgt);
  ctx.bezierCurveTo(wid*0.35,-hgt*0.88,wid*0.72,-hgt*0.55,wid*0.62,-hgt*0.18);
  ctx.quadraticCurveTo(0,-hgt*0.02,-wid*0.62,-hgt*0.18);ctx.fill();
  // inner glow
  const ig=ctx.createRadialGradient(0,-hgt*0.45,wid*0.1,0,-hgt*0.45,hgt*0.7);
  ig.addColorStop(0,'rgba(255,240,220,0.20)');ig.addColorStop(1,'rgba(255,240,220,0)');
  ctx.fillStyle=ig;ctx.beginPath();ctx.ellipse(0,-hgt*0.5,wid*1.05,hgt*0.55,0,0,7);ctx.fill();
  // iridescent shimmer streak (contemporary twist)
  if(shimmer){
    const sg=ctx.createLinearGradient(-wid*0.5,0,wid*0.5,-hgt);
    sg.addColorStop(0,'rgba(140,225,255,0)');sg.addColorStop(0.5,'rgba(170,235,255,0.34)');sg.addColorStop(1,'rgba(255,160,235,0)');
    ctx.fillStyle=sg;
    ctx.beginPath();ctx.moveTo(-wid*0.2,-hgt*0.08);
    ctx.bezierCurveTo(-wid*0.45,-hgt*0.5,-wid*0.1,-hgt*0.85,wid*0.05,-hgt*0.97);
    ctx.quadraticCurveTo(wid*0.18,-hgt*0.6,wid*0.08,-hgt*0.1);ctx.closePath();ctx.fill();
  }
  ctx.restore();ctx.globalAlpha=1;
}
function tulip(){
  const r=rng(16371637);
  const bg=ctx.createRadialGradient(W*0.5,H*0.32,H*0.06,W*0.5,H*0.55,H*0.85);
  bg.addColorStop(0,'#201217');bg.addColorStop(0.5,'#120A0D');bg.addColorStop(1,'#070405');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  const palettes=[
    ['#B01535','#E24B6E','#5C0A1E'],  // crimson
    ['#D98CA2','#F4B8C6','#8E4257'],  // blush
    ['#D4A017','#F0D27A','#7A5806'],  // gold
    ['#F2E9DA','#FFF8EC','#C9BBA4']   // ivory
  ];
  // layout: staggered heights like a still-life bouquet
  const blooms=[];
  for(let k=0;k<9;k++){
    const bx=W*(0.14+ (k/8)*0.72 + (r()-0.5)*0.07);
    const by=H*(0.22+((k*37)%5)*0.075 + r()*0.06);
    blooms.push([bx,by]);
  }
  // stems first (behind blooms) — elegant curves
  for(const [bx,by] of blooms){
    ctx.strokeStyle='rgba(34,48,26,0.85)';ctx.lineWidth=7+r()*5;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(bx+(r()-0.5)*140,H*1.02);
    ctx.quadraticCurveTo(bx+(r()-0.5)*180,(by+H)/2,bx,by);
    ctx.stroke();
    // a leaf
    if(r()>0.4){
      const ly=(by+H)/2+r()*H*0.1;
      ctx.fillStyle='rgba(40,58,32,0.75)';
      ctx.save();ctx.translate(bx+(r()-0.5)*60,ly);ctx.rotate((r()-0.5)*1.2);
      ctx.beginPath();ctx.moveTo(0,0);
      ctx.quadraticCurveTo(-H*0.012,-H*0.05,0,-H*0.11);
      ctx.quadraticCurveTo(H*0.012,-H*0.05,0,0);ctx.fill();ctx.restore();
    }
  }
  // blooms
  let si=0;
  for(const [bx,by] of blooms){
    const pal=palettes[si%palettes.length]; si++;
    const hgt=H*(0.10+r()*0.05), wid=hgt*(0.38+r()*0.08);
    tulipBloom(bx,by,hgt,wid,(r()-0.5)*0.22,pal[0],pal[1],pal[2],r()>0.5);
  }
  // floating pollen / dust in light beam
  for(let k=0;k<420;k++){
    const x=r()*W,y=r()*H,s=r()*2.6;
    ctx.fillStyle='rgba(240,210,130,'+(r()*0.5)+')';
    ctx.fillRect(x,y,s,s);
  }
  // light beam
  const beam=ctx.createLinearGradient(W*0.7,0,W*0.25,H*0.75);
  beam.addColorStop(0,'rgba(255,236,190,0.20)');beam.addColorStop(0.5,'rgba(255,236,190,0.05)');beam.addColorStop(1,'rgba(255,236,190,0)');
  ctx.fillStyle=beam;ctx.fillRect(0,0,W,H);
  grain(0.07,1637);vignette(0.42);
}

// ---------- PIECE 3: GOLDEN HOUR AMSTERDAM ----------
function amsterdam(){
  const r=rng(10251025);
  const horizon=H*0.52;
  const sky=ctx.createLinearGradient(0,0,0,horizon);
  sky.addColorStop(0,'#0A0A14');sky.addColorStop(0.55,'#2A1430');sky.addColorStop(0.85,'#7A2450');sky.addColorStop(1,'#C4498A');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,horizon);
  // sun glow
  const sun=ctx.createRadialGradient(W*0.5,horizon*0.98,10,W*0.5,horizon*0.98,W*0.45);
  sun.addColorStop(0,'rgba(255,214,140,0.95)');sun.addColorStop(0.25,'rgba(255,160,120,0.45)');sun.addColorStop(1,'rgba(255,160,120,0)');
  ctx.fillStyle=sun;ctx.fillRect(0,0,W,horizon);
  // skyline silhouettes (two depths)
  const baseY=horizon;
  ctx.fillStyle='#14060E';
  let x=-80;
  const houses=[];
  while(x<W+80){
    const w=W*(0.075+r()*0.05), h=H*(0.10+r()*0.115), t=Math.floor(r()*3);
    housePath(x,baseY,w,h,t);ctx.fill();
    houses.push([x,w,h,t]);
    x+=w*0.98;
  }
  // lit windows
  for(const [hx,w,h] of houses){
    const rows=2+Math.floor(r()*3),cols=2+Math.floor(r()*2);
    for(let i=0;i<rows;i++)for(let j=0;j<cols;j++){
      if(r()>0.62){
        ctx.fillStyle='rgba(255,196,110,'+(0.5+r()*0.5)+')';
        ctx.fillRect(hx+w*0.2+j*w*0.28, baseY-h*0.5+i*h*0.16, w*0.09, h*0.075);
      }
    }
  }
  // water
  const water=ctx.createLinearGradient(0,horizon,0,H);
  water.addColorStop(0,'#1A0A18');water.addColorStop(0.5,'#0D0714');water.addColorStop(1,'#05040A');
  ctx.fillStyle=water;ctx.fillRect(0,horizon,W,H-horizon);
  // reflections — vertical smeared strokes
  for(const [hx,w,h] of houses){
    ctx.fillStyle='rgba(20,6,14,0.55)';
    ctx.fillRect(hx,horizon,w*0.96,h*0.8);
  }
  // golden light path on water
  for(let k=0;k<900;k++){
    const t=r();
    const y=horizon+t*(H-horizon);
    const spread=W*0.03+t*W*0.16;
    const x=W*0.5+(r()-0.5)*spread;
    const len=4+r()*30*(0.3+t);
    ctx.fillStyle='rgba(255,'+(170+Math.floor(r()*60))+','+(90+Math.floor(r()*60))+','+(0.12+r()*0.5)+')';
    ctx.fillRect(x,y,len,1.6+r()*2.4);
  }
  // window reflections
  for(let k=0;k<340;k++){
    const x=r()*W,y=horizon+r()*(H-horizon);
    if(r()>0.55){
      ctx.fillStyle='rgba(255,196,120,'+(r()*0.22)+')';
      ctx.fillRect(x,y,3+r()*16,1.4+r()*1.8);
    }
  }
  // magenta brand accent — thin aurora ribbon in sky
  ctx.globalAlpha=0.5;
  const rib=ctx.createLinearGradient(0,H*0.10,W,H*0.22);
  rib.addColorStop(0,'rgba(198,30,120,0)');rib.addColorStop(0.5,'rgba(198,30,120,0.5)');rib.addColorStop(1,'rgba(41,168,223,0)');
  ctx.strokeStyle=rib;ctx.lineWidth=7;
  ctx.beginPath();ctx.moveTo(-20,H*0.16);
  ctx.bezierCurveTo(W*0.3,H*0.10,W*0.6,H*0.22,W+20,H*0.13);
  ctx.stroke();ctx.globalAlpha=1;
  // stars
  for(let k=0;k<160;k++){
    const x=r()*W,y=r()*H*0.30,s=r()*2;
    ctx.fillStyle='rgba(255,255,255,'+(r()*0.7)+')';
    ctx.fillRect(x,y,s,s);
  }
  grain(0.06,1025);vignette(0.30);
}

// ---------- PIECE 4: PATTERN LIBRARY TILE (seamless) ----------
function pattern(){
  const r=rng(88);
  ctx.fillStyle='#F6F1E7';ctx.fillRect(0,0,W,H);
  const tile=600; // seamless 600px tile repeated
  function drawMotifs(ox,oy){
    const rr=rng(4242);
    for(let gx=0;gx<W/tile+1;gx++)for(let gy=0;gy<H/tile+1;gy++){
      const bx=gx*tile+ox, by=gy*tile+oy;
      // windmill cross
      ctx.save();ctx.translate(bx+tile*0.25,by+tile*0.25);ctx.rotate(0.5);
      ctx.strokeStyle='#12306B';ctx.lineWidth=14;
      for(let i=0;i<4;i++){ctx.rotate(Math.PI/2);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-tile*0.16);ctx.stroke();
        ctx.beginPath();ctx.ellipse(0,-tile*0.11,tile*0.035,tile*0.075,0,0,7);ctx.stroke();}
      ctx.restore();
      // tulip motif
      ctx.save();ctx.translate(bx+tile*0.72,by+tile*0.3);
      ctx.fillStyle='#C4267E';
      ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(-tile*0.07,-tile*0.09,-tile*0.05,-tile*0.16,0,-tile*0.18);
      ctx.bezierCurveTo(tile*0.05,-tile*0.16,tile*0.07,-tile*0.09,0,0);ctx.fill();
      ctx.strokeStyle='#1E4FA3';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(-tile*0.02,tile*0.09,0,tile*0.16);ctx.stroke();
      ctx.restore();
      // canal house
      ctx.save();ctx.translate(bx+tile*0.24,by+tile*0.74);
      ctx.fillStyle='#1E4FA3';
      housePath(-tile*0.09,tile*0.12,tile*0.18,tile*0.24,(gx+gy)%3);ctx.fill();
      ctx.restore();
      // porcelain ring
      ctx.save();ctx.translate(bx+tile*0.73,by+tile*0.73);
      ctx.strokeStyle='#12306B';ctx.lineWidth=8;ctx.beginPath();ctx.arc(0,0,tile*0.11,0,7);ctx.stroke();
      ctx.strokeStyle='#29A8DF';ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,0,tile*0.085,0,7);ctx.stroke();
      ctx.restore();
      // scatter dots
      for(let k=0;k<14;k++){
        ctx.fillStyle=k%3?'#12306B':'#C4267E';
        const a=rr()*Math.PI*2;
        ctx.globalAlpha=0.5;
        ctx.beginPath();ctx.arc(bx+tile*0.5+Math.cos(a)*tile*0.42,by+tile*0.5+Math.sin(a)*tile*0.42,4+rr()*6,0,7);ctx.fill();
        ctx.globalAlpha=1;
      }
    }
  }
  drawMotifs(0,0);
  grain(0.03,88);
}

// ---------- PIECE 5: WINDMILL DUSK (Obsidian & Champagne) ----------
function windmill(){
  const r=rng(20260718);
  // dusk sky: warm obsidian to deep plum to a restrained champagne glow at horizon
  const horizon=H*0.66;
  const sky=ctx.createLinearGradient(0,0,0,horizon);
  sky.addColorStop(0,'#0B0A0C');sky.addColorStop(0.45,'#161119');sky.addColorStop(0.78,'#3A2A24');sky.addColorStop(1,'#8A6A3C');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,horizon);
  // champagne glow low on the horizon (sun just set), offset from the mill for a backlit silhouette
  const glow=ctx.createRadialGradient(W*0.66,horizon*1.0,10,W*0.66,horizon*1.0,W*0.46);
  glow.addColorStop(0,'rgba(203,163,92,0.55)');glow.addColorStop(0.4,'rgba(203,163,92,0.20)');glow.addColorStop(1,'rgba(203,163,92,0)');
  ctx.fillStyle=glow;ctx.fillRect(0,0,W,horizon);
  // stars, sparse and restrained
  for(let k=0;k<150;k++){
    const x=r()*W,y=r()*H*0.46,s=r()*1.8;
    ctx.fillStyle='rgba(242,237,227,'+(r()*0.65)+')';
    ctx.fillRect(x,y,s,s);
  }
  // flat polder ground below horizon, with a faint bounce of the dusk glow near the waterline
  const ground=ctx.createLinearGradient(0,horizon,0,H);
  ground.addColorStop(0,'#171210');ground.addColorStop(0.12,'#100D0D');ground.addColorStop(1,'#08070A');
  ctx.fillStyle=ground;ctx.fillRect(0,horizon,W,H-horizon);
  const bounce=ctx.createRadialGradient(W*0.66,horizon,4,W*0.66,horizon,W*0.4);
  bounce.addColorStop(0,'rgba(203,163,92,0.16)');bounce.addColorStop(1,'rgba(203,163,92,0)');
  ctx.save();ctx.beginPath();ctx.rect(0,horizon,W,H*0.12);ctx.clip();
  ctx.fillStyle=bounce;ctx.fillRect(0,horizon,W,H*0.12);ctx.restore();
  // distant reed silhouettes along the dike line, grouped in loose organic clusters
  ctx.fillStyle='#0B0809';
  for(let c=0;c<16;c++){
    const cx=r()*W, blades=2+Math.floor(r()*4);
    for(let b=0;b<blades;b++){
      const x=cx+(r()-0.5)*36, h=H*(0.005+r()*0.016), lean=(r()-0.5)*0.3;
      ctx.save();ctx.translate(x,horizon);ctx.rotate(lean);
      ctx.globalAlpha=0.5+r()*0.4;
      ctx.fillRect(0,-h,1.5+r()*1.5,h);
      ctx.restore();ctx.globalAlpha=1;
    }
  }
  // ---- the windmill itself, silhouette, offset left of the glow for a backlit look ----
  const mx=W*0.38, mbase=horizon+H*0.01;
  ctx.save();ctx.translate(mx,mbase);
  const millH=H*0.25, millW=W*0.15;
  ctx.fillStyle='#131114';
  // small mound / base platform
  ctx.beginPath();ctx.ellipse(0,0,millW*0.95,H*0.018,0,0,Math.PI,true);ctx.fill();
  // tapering tower body
  ctx.beginPath();
  ctx.moveTo(-millW*0.34,0);
  ctx.quadraticCurveTo(-millW*0.30,-millH*0.55,-millW*0.16,-millH*0.92);
  ctx.lineTo(millW*0.16,-millH*0.92);
  ctx.quadraticCurveTo(millW*0.30,-millH*0.55,millW*0.34,0);
  ctx.closePath();ctx.fill();
  // cap (rotating roof)
  ctx.beginPath();
  ctx.moveTo(-millW*0.20,-millH*0.90);
  ctx.quadraticCurveTo(-millW*0.02,-millH*1.06,millW*0.30,-millH*0.98);
  ctx.quadraticCurveTo(millW*0.10,-millH*1.0,-millW*0.20,-millH*0.90);
  ctx.fill();
  // small stoop / lean-to at base
  ctx.beginPath();
  ctx.moveTo(-millW*0.55,0);ctx.lineTo(-millW*0.55,-millH*0.16);ctx.lineTo(-millW*0.30,-millH*0.22);
  ctx.lineTo(-millW*0.30,0);ctx.closePath();ctx.fill();
  // warm lit window on the tower — the single point of colour
  ctx.fillStyle='rgba(203,163,92,0.9)';
  ctx.fillRect(-millW*0.05,-millH*0.32,millW*0.10,millH*0.06);
  // sails (wieken) — cross, one pair leaning for dynamism, lattice detail
  const hubY=-millH*0.80, hubX=millW*0.02;
  ctx.translate(hubX,hubY);
  ctx.rotate(0.30);
  ctx.strokeStyle='#131114';
  const sailLen=millH*0.62, sailW=millW*0.30;
  for(let s=0;s<4;s++){
    ctx.save();ctx.rotate(s*Math.PI/2);
    ctx.lineWidth=millW*0.045;
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-sailLen);ctx.stroke();
    // lattice sailcloth triangle
    ctx.beginPath();
    ctx.moveTo(0,-sailLen*0.14);
    ctx.lineTo(sailW*0.5,-sailLen*0.55);
    ctx.lineTo(0,-sailLen*0.96);
    ctx.lineTo(-sailW*0.02,-sailLen*0.55);
    ctx.closePath();ctx.fill();
    ctx.lineWidth=millW*0.014;ctx.globalAlpha=0.6;
    for(let g=1;g<5;g++){
      ctx.beginPath();ctx.moveTo(-sailW*0.5*(g/5),-sailLen*0.20-(sailLen*0.68)*(g/5));
      ctx.lineTo(sailW*0.5*(g/5),-sailLen*0.20-(sailLen*0.68)*(g/5));ctx.stroke();
    }
    ctx.globalAlpha=1;
    ctx.restore();
  }
  ctx.restore();
  // reflected champagne rim-light along the tower's east edge
  ctx.save();ctx.translate(mx,mbase);
  const rim=ctx.createLinearGradient(millW*0.10,0,millW*0.36,-millH*0.9);
  rim.addColorStop(0,'rgba(203,163,92,0)');rim.addColorStop(1,'rgba(203,163,92,0.35)');
  ctx.strokeStyle=rim;ctx.lineWidth=6;
  ctx.beginPath();ctx.moveTo(millW*0.34,0);ctx.quadraticCurveTo(millW*0.30,-millH*0.55,millW*0.16,-millH*0.92);ctx.stroke();
  ctx.restore();
  // birds, distant, minimal
  ctx.strokeStyle='rgba(242,237,227,0.4)';ctx.lineWidth=2;
  for(let k=0;k<4;k++){
    const bx=r()*W, by=H*0.16+r()*H*0.10, bw=8+r()*10;
    ctx.beginPath();ctx.moveTo(bx-bw,by);ctx.quadraticCurveTo(bx,by-bw*0.6,bx+bw,by);ctx.stroke();
  }
  grain(0.05,20260718);vignette(0.26);
}

// ---------- PIECE 6: CANAL REFLECTIONS — DELFT ----------
function canaldelft(){
  const r=rng(20260719);
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#F7F2E9');bg.addColorStop(0.55,'#F2ECDF');bg.addColorStop(1,'#EAE1CF');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  const horizon=H*0.46;
  // soft sky wash above houses
  const sky=ctx.createLinearGradient(0,0,0,horizon);
  sky.addColorStop(0,'#EFE9DC');sky.addColorStop(1,'#F6F1E6');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,horizon);
  // canal house row, cobalt silhouettes, along the horizon
  const blues=['#0E2450','#12306B','#1E4FA3'];
  const houses=[];
  let x=-40;
  while(x<W+40){
    const w=W*(0.11+r()*0.05), h=H*(0.14+r()*0.09), t=Math.floor(r()*3);
    houses.push([x,w,h,t,blues[Math.floor(r()*blues.length)]]);
    x+=w*0.96;
  }
  for(const [hx,w,h,t,col] of houses){
    ctx.fillStyle=col;housePath(hx,horizon,w*0.94,h,t);ctx.fill();
  }
  // faint window lines (ivory) on the houses
  for(const [hx,w,h] of houses){
    ctx.strokeStyle='rgba(242,237,227,0.5)';ctx.lineWidth=2;
    const rows=2+Math.floor(r()*2),cols=2;
    for(let i=0;i<rows;i++)for(let j=0;j<cols;j++){
      ctx.strokeRect(hx+w*0.22+j*w*0.30, horizon-h*0.55+i*h*0.15, w*0.10, h*0.10);
    }
  }
  // water body
  const water=ctx.createLinearGradient(0,horizon,0,H);
  water.addColorStop(0,'#DCE7EF');water.addColorStop(0.5,'#C9DCE9');water.addColorStop(1,'#B7D0E1');
  ctx.fillStyle=water;ctx.fillRect(0,horizon,W,H-horizon);
  // mirrored houses drawn once more, flipped, then broken into rippled horizontal strips
  ctx.save();
  ctx.translate(0,horizon*2);ctx.scale(1,-1);
  for(const [hx,w,h,t,col] of houses){
    ctx.globalAlpha=0.55;ctx.fillStyle=col;housePath(hx,horizon,w*0.94,h,t);ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.restore();
  // ripple distortion: resample the reflection in thin horizontal bands with sinusoidal x-offset,
  // fading with depth, reading straight from the canvas itself (self-referential drawImage)
  const rr=rng(4242);
  const reflectH=H-horizon;
  const bandH=3;
  for(let i=0;i<reflectH/bandH;i++){
    const dy=horizon+i*bandH;
    const sy=horizon*2-dy-bandH; // mirror sample point above the horizon
    if(sy<0)break;
    const depth=i*bandH/reflectH;
    const wobble=Math.sin(i*0.12+rr()*0.6)*7*(1-depth*0.5);
    ctx.globalAlpha=0.62*(1-depth*0.55);
    ctx.drawImage(canvas,0,sy,W,bandH,wobble,dy,W,bandH);
  }
  ctx.globalAlpha=1;
  // watery tint wash over reflection for cohesion
  ctx.fillStyle='rgba(201,220,233,0.22)';ctx.fillRect(0,horizon,W,H-horizon);
  // sparkle highlights on the water
  for(let k=0;k<220;k++){
    const y=horizon+r()*(H-horizon);
    const x=r()*W, len=3+r()*14;
    ctx.fillStyle='rgba(255,255,255,'+(0.08+r()*0.30)+')';
    ctx.fillRect(x,y,len,1+r()*1.6);
  }
  // a thin cobalt waterline at the horizon
  ctx.strokeStyle='rgba(14,36,80,0.35)';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(0,horizon);ctx.lineTo(W,horizon);ctx.stroke();
  grain(0.045,20260719);vignette(0.14);
}

// ---------- PIECE 7: GOLDEN HOUR — AMSTERDAM (ambient loop, landscape, time t in [0,1)) ----------
function amsterdamLoop(t){
  const r=rng(10251025);
  const horizon=H*0.46;
  const sky=ctx.createLinearGradient(0,0,0,horizon);
  sky.addColorStop(0,'#0A0A14');sky.addColorStop(0.55,'#2A1430');sky.addColorStop(0.85,'#7A2450');sky.addColorStop(1,'#C4498A');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,horizon);
  // slow breathing sun glow — exactly one breath per loop
  const breathe=Math.sin(2*Math.PI*t);
  const sun=ctx.createRadialGradient(W*0.5,horizon*0.98,10,W*0.5,horizon*0.98,W*0.40*(1+0.05*breathe));
  sun.addColorStop(0,'rgba(255,214,140,'+(0.95+0.05*breathe)+')');
  sun.addColorStop(0.22,'rgba(255,180,130,0.55)');sun.addColorStop(0.55,'rgba(255,150,120,0.20)');sun.addColorStop(1,'rgba(255,150,120,0)');
  ctx.fillStyle=sun;ctx.fillRect(0,0,W,horizon);
  // skyline
  const baseY=horizon;
  ctx.fillStyle='#14060E';
  let x=-80;
  const houses=[];
  while(x<W+80){
    const w=W*(0.075+r()*0.045), h=H*(0.15+r()*0.09), tp=Math.floor(r()*3);
    housePath(x,baseY,w,h,tp);ctx.fill();
    houses.push([x,w,h,tp]);
    x+=w*0.98;
  }
  // lit windows — subtle per-window flicker, integer cycles per loop so it stays seamless
  for(const [hx,w,h] of houses){
    const rows=2+Math.floor(r()*3),cols=2+Math.floor(r()*2);
    for(let i=0;i<rows;i++)for(let j=0;j<cols;j++){
      const lit=r()>0.62;
      const k=2+Math.floor(r()*4), ph=r()*Math.PI*2, base=0.5+r()*0.5;
      if(lit){
        const flick=0.75+0.25*Math.sin(2*Math.PI*t*k+ph);
        ctx.fillStyle='rgba(255,196,110,'+(base*flick)+')';
        ctx.fillRect(hx+w*0.2+j*w*0.28, baseY-h*0.5+i*h*0.16, w*0.09, h*0.075);
      }
    }
  }
  // water
  const water=ctx.createLinearGradient(0,horizon,0,H);
  water.addColorStop(0,'#1A0A18');water.addColorStop(0.5,'#0D0714');water.addColorStop(1,'#05040A');
  ctx.fillStyle=water;ctx.fillRect(0,horizon,W,H-horizon);
  // building reflections (static smear, fading with depth for a softer blur)
  for(const [hx,w,h] of houses){
    const rh=h*0.62;
    const rg=ctx.createLinearGradient(0,horizon,0,horizon+rh);
    rg.addColorStop(0,'rgba(20,6,14,0.60)');rg.addColorStop(1,'rgba(20,6,14,0.05)');
    ctx.fillStyle=rg;
    ctx.fillRect(hx,horizon,w*0.96,rh);
  }
  // golden light path — sparkles gently orbit + twinkle, exact periodic motion (perfect loop)
  for(let k=0;k<650;k++){
    const u=r();
    const y0=horizon+u*(H-horizon);
    const spread=W*0.05+u*W*0.24;
    const x0=W*0.5+(r()-0.5)*spread;
    const len=4+r()*20*(0.3+u);
    const phase=r()*Math.PI*2;
    const orbitR=2+r()*6;
    const twK=1+Math.floor(r()*2);
    const xx=x0+orbitR*Math.sin(2*Math.PI*t+phase);
    const yy=y0+orbitR*0.4*Math.cos(2*Math.PI*t+phase);
    const twinkle=0.5+0.5*Math.sin(2*Math.PI*t*twK+phase*1.7);
    const baseAlpha=0.10+r()*0.45;
    ctx.fillStyle='rgba(255,'+(170+Math.floor(r()*60))+','+(90+Math.floor(r()*60))+','+(baseAlpha*(0.35+0.65*twinkle))+')';
    ctx.fillRect(xx,yy,len,1.6+r()*2.2);
  }
  // scattered window-light reflections on the water (static)
  for(let k=0;k<300;k++){
    const wx=r()*W,wy=horizon+r()*(H-horizon);
    if(r()>0.55){
      ctx.fillStyle='rgba(255,196,120,'+(r()*0.20)+')';
      ctx.fillRect(wx,wy,3+r()*14,1.4+r()*1.6);
    }
  }
  // magenta/cobalt aurora ribbon accent
  ctx.globalAlpha=0.42;
  const rib=ctx.createLinearGradient(0,H*0.08,W,H*0.20);
  rib.addColorStop(0,'rgba(198,30,120,0)');rib.addColorStop(0.5,'rgba(198,30,120,0.45)');rib.addColorStop(1,'rgba(41,168,223,0)');
  ctx.strokeStyle=rib;ctx.lineWidth=5;
  ctx.beginPath();ctx.moveTo(-20,H*0.14);
  ctx.bezierCurveTo(W*0.3,H*0.08,W*0.6,H*0.19,W+20,H*0.11);
  ctx.stroke();ctx.globalAlpha=1;
  // floating stars — gentle orbit + twinkle
  for(let k=0;k<140;k++){
    const x0=r()*W,y0=r()*H*0.34;
    const phase=r()*Math.PI*2;
    const amp=2+r()*4;
    const twK=2+Math.floor(r()*3);
    const xx=x0+amp*Math.sin(2*Math.PI*t+phase);
    const yy=y0+amp*0.6*Math.cos(2*Math.PI*t+phase*1.3);
    const s=r()*1.8;
    const tw=0.4+0.6*(0.5+0.5*Math.sin(2*Math.PI*t*twK+phase));
    ctx.fillStyle='rgba(255,255,255,'+(tw*0.7)+')';
    ctx.fillRect(xx,yy,s,s);
  }
  grain(0.05,1025);vignette(0.24);
}

// ---------- PIECE 8: TULIPOMANIA — NOCTURNE (ambient loop, portrait, time t in [0,1)) ----------
function tulipLoop(t){
  const r=rng(16371637);
  const bg=ctx.createRadialGradient(W*0.5,H*0.32,H*0.06,W*0.5,H*0.55,H*0.85);
  bg.addColorStop(0,'#201217');bg.addColorStop(0.5,'#120A0D');bg.addColorStop(1,'#070405');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  function bloomAnim(cx,cy,hgt,wid,leanBase,swayPhase,c1,c2,c3,shimmer,glowPhase){
    const sway=leanBase+(Math.PI/180)*(1+0.6*Math.sin(2*Math.PI*0))*Math.sin(2*Math.PI*t+swayPhase);
    ctx.save();ctx.translate(cx,cy);ctx.rotate(sway);
    const grad=(a,b)=>{const g=ctx.createLinearGradient(0,0,0,-hgt);g.addColorStop(0,a);g.addColorStop(1,b);return g;};
    ctx.fillStyle=grad(c3,c2);ctx.globalAlpha=0.95;
    ctx.beginPath();ctx.moveTo(0,0);
    ctx.bezierCurveTo(-wid*1.05,-hgt*0.30,-wid*0.95,-hgt*0.72,-wid*0.55,-hgt*0.98);
    ctx.quadraticCurveTo(-wid*0.42,-hgt*0.80,-wid*0.18,-hgt*0.62);
    ctx.quadraticCurveTo(-wid*0.3,-hgt*0.3,0,0);ctx.fill();
    ctx.beginPath();ctx.moveTo(0,0);
    ctx.bezierCurveTo(wid*1.05,-hgt*0.30,wid*0.95,-hgt*0.72,wid*0.55,-hgt*0.98);
    ctx.quadraticCurveTo(wid*0.42,-hgt*0.80,wid*0.18,-hgt*0.62);
    ctx.quadraticCurveTo(wid*0.3,-hgt*0.3,0,0);ctx.fill();
    ctx.fillStyle=grad(c1,c2);ctx.globalAlpha=1;
    ctx.beginPath();ctx.moveTo(-wid*0.62,-hgt*0.18);
    ctx.bezierCurveTo(-wid*0.72,-hgt*0.55,-wid*0.35,-hgt*0.88,0,-hgt);
    ctx.bezierCurveTo(wid*0.35,-hgt*0.88,wid*0.72,-hgt*0.55,wid*0.62,-hgt*0.18);
    ctx.quadraticCurveTo(0,-hgt*0.02,-wid*0.62,-hgt*0.18);ctx.fill();
    // breathing inner glow — per-flower phase so the bouquet breathes organically, not in unison
    const breathe=0.5+0.5*Math.sin(2*Math.PI*t+glowPhase);
    const ig=ctx.createRadialGradient(0,-hgt*0.45,wid*0.1,0,-hgt*0.45,hgt*0.7);
    ig.addColorStop(0,'rgba(255,240,220,'+(0.12+0.16*breathe)+')');ig.addColorStop(1,'rgba(255,240,220,0)');
    ctx.fillStyle=ig;ctx.beginPath();ctx.ellipse(0,-hgt*0.5,wid*(1.0+0.10*breathe),hgt*(0.50+0.08*breathe),0,0,7);ctx.fill();
    if(shimmer){
      const sg=ctx.createLinearGradient(-wid*0.5,0,wid*0.5,-hgt);
      sg.addColorStop(0,'rgba(140,225,255,0)');sg.addColorStop(0.5,'rgba(170,235,255,'+(0.18+0.20*breathe)+')');sg.addColorStop(1,'rgba(255,160,235,0)');
      ctx.fillStyle=sg;
      ctx.beginPath();ctx.moveTo(-wid*0.2,-hgt*0.08);
      ctx.bezierCurveTo(-wid*0.45,-hgt*0.5,-wid*0.1,-hgt*0.85,wid*0.05,-hgt*0.97);
      ctx.quadraticCurveTo(wid*0.18,-hgt*0.6,wid*0.08,-hgt*0.1);ctx.closePath();ctx.fill();
    }
    ctx.restore();ctx.globalAlpha=1;
  }
  const palettes=[
    ['#B01535','#E24B6E','#5C0A1E'],
    ['#D98CA2','#F4B8C6','#8E4257'],
    ['#D4A017','#F0D27A','#7A5806'],
    ['#F2E9DA','#FFF8EC','#C9BBA4']
  ];
  const blooms=[];
  for(let k=0;k<9;k++){
    const bx=W*(0.14+ (k/8)*0.72 + (r()-0.5)*0.07);
    const by=H*(0.22+((k*37)%5)*0.075 + r()*0.06);
    blooms.push({bx,by});
  }
  // precompute all per-bloom random attributes once, in fixed order, so every frame draws identically
  // except for the time-dependent sway/breathe/drift terms
  for(const b of blooms){
    b.stemBaseOffset=(r()-0.5)*140;
    b.stemCtrlOffset=(r()-0.5)*180;
    b.hasLeaf=r()>0.4;
    b.leafYoff=r()*H*0.1;
    b.leafXoff=(r()-0.5)*60;
    b.leafRot=(r()-0.5)*1.2;
    b.lean=(r()-0.5)*0.22;
    b.swayPhase=r()*Math.PI*2;
  }
  let si=0;
  for(const b of blooms){
    const pal=palettes[si%palettes.length];si++;
    b.hgt=H*(0.10+r()*0.05);b.wid=b.hgt*(0.38+r()*0.08);
    b.pal=pal;b.shimmer=r()>0.5;b.glowPhase=r()*Math.PI*2;
  }
  // stems, swaying gently (1-2 degrees) in sync with their bloom
  for(const b of blooms){
    const sway=(1+r()*0)*0; // placeholder not used; stem follows same sway as bloom base rotation visually via bx shift
    const swayPx=Math.sin(2*Math.PI*t+b.swayPhase)*(b.hgt*0.02);
    ctx.strokeStyle='rgba(34,48,26,0.85)';ctx.lineWidth=7;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(b.bx+b.stemBaseOffset,H*1.02);
    ctx.quadraticCurveTo(b.bx+b.stemCtrlOffset+swayPx*2,(b.by+H)/2,b.bx+swayPx,b.by);
    ctx.stroke();
    if(b.hasLeaf){
      const ly=(b.by+H)/2+b.leafYoff;
      ctx.fillStyle='rgba(40,58,32,0.75)';
      ctx.save();ctx.translate(b.bx+b.leafXoff+swayPx,ly);ctx.rotate(b.leafRot+swayPx*0.01);
      ctx.beginPath();ctx.moveTo(0,0);
      ctx.quadraticCurveTo(-H*0.012,-H*0.05,0,-H*0.11);
      ctx.quadraticCurveTo(H*0.012,-H*0.05,0,0);ctx.fill();ctx.restore();
    }
  }
  // blooms, each with its own subtle sway + breathing glow
  for(const b of blooms){
    bloomAnim(b.bx,b.by,b.hgt,b.wid,b.lean,b.swayPhase,b.pal[0],b.pal[1],b.pal[2],b.shimmer,b.glowPhase);
  }
  // slowly floating gold dust — one full vertical traverse per loop (k=1), so start/end match exactly
  for(let k=0;k<420;k++){
    const x0=r()*W,y0=r()*H,s=r()*2.6,ph=r()*Math.PI*2;
    const drift=((y0-t*H)%H+H)%H;
    const xx=x0+Math.sin(2*Math.PI*t+ph)*6;
    ctx.fillStyle='rgba(240,210,130,'+(r()*0.5)+')';
    ctx.fillRect(xx,drift,s,s);
  }
  // light beam (static)
  const beam=ctx.createLinearGradient(W*0.7,0,W*0.25,H*0.75);
  beam.addColorStop(0,'rgba(255,236,190,0.20)');beam.addColorStop(0.5,'rgba(255,236,190,0.05)');beam.addColorStop(1,'rgba(255,236,190,0)');
  ctx.fillStyle=beam;ctx.fillRect(0,0,W,H);
  grain(0.07,1637);vignette(0.42);
}

// ---------- dispatch ----------
function renderFrame(pieceName,frame,frames,w,h){
  frame=frame||0;frames=frames||1;
  if(w&&h)setSize(w,h);
  const t=(((frame%frames)+frames)%frames)/frames;
  if(pieceName==='delft')delft();
  else if(pieceName==='tulip')tulip();
  else if(pieceName==='amsterdam')amsterdam();
  else if(pieceName==='pattern')pattern();
  else if(pieceName==='windmill')windmill();
  else if(pieceName==='canaldelft')canaldelft();
  else if(pieceName==='amsterdam-loop')amsterdamLoop(t);
  else if(pieceName==='tulip-loop')tulipLoop(t);
  document.title='done-'+pieceName+'-'+frame;
}
window.renderFrame=renderFrame;

// ---------- initial render from URL params ----------
(function(){
  const frame=parseInt(qp.get('frame')||'0',10);
  const frames=parseInt(qp.get('frames')||'360',10);
  const wp=qp.get('w')?parseInt(qp.get('w'),10):null;
  const hp=qp.get('h')?parseInt(qp.get('h'),10):null;
  let dw=wp,dh=hp;
  if(!dw||!dh){
    if(piece==='amsterdam-loop'){dw=1920;dh=1080;}
    else if(piece==='tulip-loop'){dw=1080;dh=1350;}
    else{dw=2400;dh=3000;}
  }
  renderFrame(piece,frame,frames,dw,dh);
})();
