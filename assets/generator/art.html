<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><style>html,body{margin:0;padding:0;background:#111}canvas{display:block}</style></head>
<body>
<canvas id="c" width="2400" height="3000"></canvas>
<script>
// Deterministic seeded RNG (mulberry32)
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const W=canvas.width,H=canvas.height;
const piece=new URLSearchParams(location.search).get('piece')||'delft';

// ---------- shared helpers ----------
function grain(alpha,seed){
  const r=rng(seed);const n=Math.floor(W*H/900);
  for(let i=0;i<n;i++){const x=r()*W,y=r()*H,a=r()*alpha;
    ctx.fillStyle='rgba('+(r()>0.5?'255,255,255':'0,0,0')+','+a+')';
    ctx.fillRect(x,y,1.5,1.5);}
}
function vignette(strength){
  const g=ctx.createRadialGradient(W/2,H/2,H*0.25,W/2,H/2,H*0.75);
  g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,'+strength+')');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}
// canal house silhouette path (three gable types), h = height, w = width
function housePath(x,base,w,h,type){
  ctx.beginPath();
  if(type===0){ // step gable
    const steps=5,sw=w/2/steps,sh=h*0.45/steps;
    ctx.moveTo(x,base);ctx.lineTo(x,base-h*0.55);
    for(let i=0;i<steps;i++){ctx.lineTo(x+i*sw,base-h*0.55-(i)*sh);ctx.lineTo(x+(i+1)*sw,base-h*0.55-(i)*sh);}
    ctx.lineTo(x+w/2,base-h);
    for(let i=steps-1;i>=0;i--){ctx.lineTo(x+w-(i+1)*sw,base-h*0.55-(i)*sh);ctx.lineTo(x+w-i*sw,base-h*0.55-(i)*sh);}
    ctx.lineTo(x+w,base-h*0.55);ctx.lineTo(x+w,base);
  } else if(type===1){ // bell gable
    ctx.moveTo(x,base);ctx.lineTo(x,base-h*0.6);
    ctx.bezierCurveTo(x+w*0.05,base-h*0.75,x+w*0.28,base-h*0.72,x+w*0.32,base-h*0.9);
    ctx.quadraticCurveTo(x+w*0.4,base-h*1.02,x+w*0.5,base-h*1.02);
    ctx.quadraticCurveTo(x+w*0.6,base-h*1.02,x+w*0.68,base-h*0.9);
    ctx.bezierCurveTo(x+w*0.72,base-h*0.72,x+w*0.95,base-h*0.75,x+w,base-h*0.6);
    ctx.lineTo(x+w,base);
  } else { // neck gable
    ctx.moveTo(x,base);ctx.lineTo(x,base-h*0.62);ctx.lineTo(x+w*0.3,base-h*0.62);
    ctx.lineTo(x+w*0.3,base-h*0.95);
    ctx.quadraticCurveTo(x+w*0.5,base-h*1.08,x+w*0.7,base-h*0.95);
    ctx.lineTo(x+w*0.7,base-h*0.62);ctx.lineTo(x+w,base-h*0.62);ctx.lineTo(x+w,base);
  }
  ctx.closePath();
}

// ---------- PIECE 1: DELFT FLOW ----------
function delft(){
  const r=rng(20261717);
  // ivory ground with subtle paper wash
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#F7F2E9');bg.addColorStop(0.6,'#F3EDE1');bg.addColorStop(1,'#EDE5D5');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  // flowing cobalt ribbons (flow field)
  const blues=['#12306B','#1E4FA3','#2B6BC4','#0E2450','#3E7ED4'];
  for(let k=0;k<170;k++){
    let x=r()*W, y=r()*H*0.9+H*0.05;
    const col=blues[Math.floor(r()*blues.length)];
    const lw=1+Math.pow(r(),2)*26;
    ctx.strokeStyle=col;ctx.globalAlpha=0.10+r()*0.5;ctx.lineWidth=lw;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(x,y);
    const steps=40+Math.floor(r()*80);
    for(let i=0;i<steps;i++){
      const a=Math.sin(x*0.0016+y*0.0011)+Math.cos(y*0.0019-x*0.0007)*1.2;
      x+=Math.cos(a)*14; y+=Math.sin(a)*14+1.5;
      ctx.lineTo(x,y);
    }
    ctx.stroke();ctx.globalAlpha=1;
  }
  // porcelain plate fragments
  for(let k=0;k<7;k++){
    const cx=r()*W, cy=r()*H*0.55+H*0.06, rad=90+r()*230;
    ctx.save();ctx.translate(cx,cy);ctx.rotate(r()*Math.PI);
    ctx.beginPath();ctx.arc(0,0,rad,r()*1.2,Math.PI*(1.05+r()*0.85));
    ctx.strokeStyle='#12306B';ctx.lineWidth=8+r()*14;ctx.globalAlpha=0.75;ctx.stroke();
    ctx.beginPath();ctx.arc(0,0,rad*0.82,r()*1.2,Math.PI*(1.0+r()*0.8));
    ctx.lineWidth=3+r()*5;ctx.globalAlpha=0.55;ctx.stroke();
    ctx.restore();ctx.globalAlpha=1;
  }
  // botanical dots and leaves
  for(let k=0;k<260;k++){
    const x=r()*W,y=r()*H*0.92,s=2+r()*9;
    ctx.fillStyle=blues[Math.floor(r()*blues.length)];
    ctx.globalAlpha=0.25+r()*0.55;
    ctx.beginPath();ctx.ellipse(x,y,s,s*(0.4+r()*0.6),r()*Math.PI,0,7);ctx.fill();
    ctx.globalAlpha=1;
  }
  // canal house skyline at base in deep cobalt
  ctx.fillStyle='#0E2450';
  const n=9;let x=-60;
  const baseY=H*0.985;
  for(let i=0;i<n;i++){
    const w=W/n*1.12,h=H*(0.16+r()*0.10);
    housePath(x,baseY,w*0.92,h,i%3);ctx.globalAlpha=0.92;ctx.fill();ctx.globalAlpha=1;
    x+=w*0.94;
  }
  // platinum leaf accents
  for(let k=0;k<26;k++){
    const x=r()*W,y=r()*H*0.75,s=8+r()*30;
    const g=ctx.createLinearGradient(x-s,y-s,x+s,y+s);
    g.addColorStop(0,'#EAE6DC');g.addColorStop(0.5,'#CFC8B8');g.addColorStop(1,'#B8AF9C');
    ctx.fillStyle=g;ctx.globalAlpha=0.8;
    ctx.beginPath();ctx.ellipse(x,y,s,s*0.62,r()*Math.PI,0,7);ctx.fill();ctx.globalAlpha=1;
  }
  grain(0.05,7);vignette(0.10);
}

// ---------- PIECE 2: TULIPOMANIA ----------
function tulip(){
  const r=rng(16371637);
  const bg=ctx.createRadialGradient(W*0.5,H*0.32,H*0.06,W*0.5,H*0.55,H*0.85);
  bg.addColorStop(0,'#201217');bg.addColorStop(0.5,'#120A0D');bg.addColorStop(1,'#070405');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  // true tulip: closed cup, pointed petals. base at (cx,cy), tip up.
  function tulipBloom(cx,cy,hgt,wid,lean,c1,c2,c3,shimmer){
    ctx.save();ctx.translate(cx,cy);ctx.rotate(lean);
    const grad=(a,b)=>{const g=ctx.createLinearGradient(0,0,0,-hgt);g.addColorStop(0,a);g.addColorStop(1,b);return g;};
    // back petals (left & right, tips flare slightly outward)
    ctx.fillStyle=grad(c3,c2);ctx.globalAlpha=0.95;
    ctx.beginPath();ctx.moveTo(0,0);
    ctx.bezierCurveTo(-wid*1.05,-hgt*0.30,-wid*0.95,-hgt*0.72,-wid*0.55,-hgt*0.98);
    ctx.quadraticCurveTo(-wid*0.42,-hgt*0.80,-wid*0.18,-hgt*0.62);
    ctx.quadraticCurveTo(-wid*0.3,-hgt*0.3,0,0);ctx.fill();
    ctx.beginPath();ctx.moveTo(0,0);
    ctx.bezierCurveTo(wid*1.05,-hgt*0.30,wid*0.95,-hgt*0.72,wid*0.55,-hgt*0.98);
    ctx.quadraticCurveTo(wid*0.42,-hgt*0.80,wid*0.18,-hgt*0.62);
    ctx.quadraticCurveTo(wid*0.3,-hgt*0.3,0,0);ctx.fill();
    // center petal — tall cup with pointed tip
    ctx.fillStyle=grad(c1,c2);ctx.globalAlpha=1;
    ctx.beginPath();ctx.moveTo(-wid*0.62,-hgt*0.18);
    ctx.bezierCurveTo(-wid*0.72,-hgt*0.55,-wid*0.35,-hgt*0.88,0,-hgt);
    ctx.bezierCurveTo(wid*0.35,-hgt*0.88,wid*0.72,-hgt*0.55,wid*0.62,-hgt*0.18);
    ctx.quadraticCurveTo(0,-hgt*0.02,-wid*0.62,-hgt*0.18);ctx.fill();
    // inner glow
    const ig=ctx.createRadialGradient(0,-hgt*0.45,wid*0.1,0,-hgt*0.45,hgt*0.7);
    ig.addColorStop(0,'rgba(255,240,220,0.20)');ig.addColorStop(1,'rgba(255,240,220,0)');
    ctx.fillStyle=ig;ctx.beginPath();ctx.ellipse(0,-hgt*0.5,wid*1.05,hgt*0.55,0,0,7);ctx.fill();
    // iridescent shimmer streak (contemporary twist)
    if(shimmer){
      const sg=ctx.createLinearGradient(-wid*0.5,0,wid*0.5,-hgt);
      sg.addColorStop(0,'rgba(140,225,255,0)');sg.addColorStop(0.5,'rgba(170,235,255,0.34)');sg.addColorStop(1,'rgba(255,160,235,0)');
      ctx.fillStyle=sg;
      ctx.beginPath();ctx.moveTo(-wid*0.2,-hgt*0.08);
      ctx.bezierCurveTo(-wid*0.45,-hgt*0.5,-wid*0.1,-hgt*0.85,wid*0.05,-hgt*0.97);
      ctx.quadraticCurveTo(wid*0.18,-hgt*0.6,wid*0.08,-hgt*0.1);ctx.closePath();ctx.fill();
    }
    ctx.restore();ctx.globalAlpha=1;
  }
  const palettes=[
    ['#B01535','#E24B6E','#5C0A1E'],  // crimson
    ['#D98CA2','#F4B8C6','#8E4257'],  // blush
    ['#D4A017','#F0D27A','#7A5806'],  // gold
    ['#F2E9DA','#FFF8EC','#C9BBA4']   // ivory
  ];
  // layout: staggered heights like a still-life bouquet
  const blooms=[];
  for(let k=0;k<9;k++){
    const bx=W*(0.14+ (k/8)*0.72 + (r()-0.5)*0.07);
    const by=H*(0.22+((k*37)%5)*0.075 + r()*0.06);
    blooms.push([bx,by]);
  }
  // stems first (behind blooms) — elegant curves
  for(const [bx,by] of blooms){
    ctx.strokeStyle='rgba(34,48,26,0.85)';ctx.lineWidth=7+r()*5;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(bx+(r()-0.5)*140,H*1.02);
    ctx.quadraticCurveTo(bx+(r()-0.5)*180,(by+H)/2,bx,by);
    ctx.stroke();
    // a leaf
    if(r()>0.4){
      const ly=(by+H)/2+r()*H*0.1;
      ctx.fillStyle='rgba(40,58,32,0.75)';
      ctx.save();ctx.translate(bx+(r()-0.5)*60,ly);ctx.rotate((r()-0.5)*1.2);
      ctx.beginPath();ctx.moveTo(0,0);
      ctx.quadraticCurveTo(-H*0.012,-H*0.05,0,-H*0.11);
      ctx.quadraticCurveTo(H*0.012,-H*0.05,0,0);ctx.fill();ctx.restore();
    }
  }
  // blooms
  let si=0;
  for(const [bx,by] of blooms){
    const pal=palettes[si%palettes.length]; si++;
    const hgt=H*(0.10+r()*0.05), wid=hgt*(0.38+r()*0.08);
    tulipBloom(bx,by,hgt,wid,(r()-0.5)*0.22,pal[0],pal[1],pal[2],r()>0.5);
  }
  // floating pollen / dust in light beam
  for(let k=0;k<420;k++){
    const x=r()*W,y=r()*H,s=r()*2.6;
    ctx.fillStyle='rgba(240,210,130,'+(r()*0.5)+')';
    ctx.fillRect(x,y,s,s);
  }
  // light beam
  const beam=ctx.createLinearGradient(W*0.7,0,W*0.25,H*0.75);
  beam.addColorStop(0,'rgba(255,236,190,0.20)');beam.addColorStop(0.5,'rgba(255,236,190,0.05)');beam.addColorStop(1,'rgba(255,236,190,0)');
  ctx.fillStyle=beam;ctx.fillRect(0,0,W,H);
  grain(0.07,1637);vignette(0.42);
}

// ---------- PIECE 3: GOLDEN HOUR AMSTERDAM ----------
function amsterdam(){
  const r=rng(10251025);
  const horizon=H*0.52;
  const sky=ctx.createLinearGradient(0,0,0,horizon);
  sky.addColorStop(0,'#0A0A14');sky.addColorStop(0.55,'#2A1430');sky.addColorStop(0.85,'#7A2450');sky.addColorStop(1,'#C4498A');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,horizon);
  // sun glow
  const sun=ctx.createRadialGradient(W*0.5,horizon*0.98,10,W*0.5,horizon*0.98,W*0.45);
  sun.addColorStop(0,'rgba(255,214,140,0.95)');sun.addColorStop(0.25,'rgba(255,160,120,0.45)');sun.addColorStop(1,'rgba(255,160,120,0)');
  ctx.fillStyle=sun;ctx.fillRect(0,0,W,horizon);
  // skyline silhouettes (two depths)
  const baseY=horizon;
  ctx.fillStyle='#14060E';
  let x=-80;
  const houses=[];
  while(x<W+80){
    const w=W*(0.075+r()*0.05), h=H*(0.10+r()*0.115), t=Math.floor(r()*3);
    housePath(x,baseY,w,h,t);ctx.fill();
    houses.push([x,w,h,t]);
    x+=w*0.98;
  }
  // lit windows
  for(const [hx,w,h] of houses){
    const rows=2+Math.floor(r()*3),cols=2+Math.floor(r()*2);
    for(let i=0;i<rows;i++)for(let j=0;j<cols;j++){
      if(r()>0.62){
        ctx.fillStyle='rgba(255,196,110,'+(0.5+r()*0.5)+')';
        ctx.fillRect(hx+w*0.2+j*w*0.28, baseY-h*0.5+i*h*0.16, w*0.09, h*0.075);
      }
    }
  }
  // water
  const water=ctx.createLinearGradient(0,horizon,0,H);
  water.addColorStop(0,'#1A0A18');water.addColorStop(0.5,'#0D0714');water.addColorStop(1,'#05040A');
  ctx.fillStyle=water;ctx.fillRect(0,horizon,W,H-horizon);
  // reflections — vertical smeared strokes
  for(const [hx,w,h] of houses){
    ctx.fillStyle='rgba(20,6,14,0.55)';
    ctx.fillRect(hx,horizon,w*0.96,h*0.8);
  }
  // golden light path on water
  for(let k=0;k<900;k++){
    const t=r();
    const y=horizon+t*(H-horizon);
    const spread=W*0.03+t*W*0.16;
    const x=W*0.5+(r()-0.5)*spread;
    const len=4+r()*30*(0.3+t);
    ctx.fillStyle='rgba(255,'+(170+Math.floor(r()*60))+','+(90+Math.floor(r()*60))+','+(0.12+r()*0.5)+')';
    ctx.fillRect(x,y,len,1.6+r()*2.4);
  }
  // window reflections
  for(let k=0;k<340;k++){
    const x=r()*W,y=horizon+r()*(H-horizon);
    if(r()>0.55){
      ctx.fillStyle='rgba(255,196,120,'+(r()*0.22)+')';
      ctx.fillRect(x,y,3+r()*16,1.4+r()*1.8);
    }
  }
  // magenta brand accent — thin aurora ribbon in sky
  ctx.globalAlpha=0.5;
  const rib=ctx.createLinearGradient(0,H*0.10,W,H*0.22);
  rib.addColorStop(0,'rgba(198,30,120,0)');rib.addColorStop(0.5,'rgba(198,30,120,0.5)');rib.addColorStop(1,'rgba(41,168,223,0)');
  ctx.strokeStyle=rib;ctx.lineWidth=7;
  ctx.beginPath();ctx.moveTo(-20,H*0.16);
  ctx.bezierCurveTo(W*0.3,H*0.10,W*0.6,H*0.22,W+20,H*0.13);
  ctx.stroke();ctx.globalAlpha=1;
  // stars
  for(let k=0;k<160;k++){
    const x=r()*W,y=r()*H*0.30,s=r()*2;
    ctx.fillStyle='rgba(255,255,255,'+(r()*0.7)+')';
    ctx.fillRect(x,y,s,s);
  }
  grain(0.06,1025);vignette(0.30);
}

// ---------- PIECE 4: PATTERN LIBRARY TILE (seamless) ----------
function pattern(){
  const r=rng(88);
  ctx.fillStyle='#F6F1E7';ctx.fillRect(0,0,W,H);
  const tile=600; // seamless 600px tile repeated
  function drawMotifs(ox,oy){
    const rr=rng(4242);
    for(let gx=0;gx<W/tile+1;gx++)for(let gy=0;gy<H/tile+1;gy++){
      const bx=gx*tile+ox, by=gy*tile+oy;
      // windmill cross
      ctx.save();ctx.translate(bx+tile*0.25,by+tile*0.25);ctx.rotate(0.5);
      ctx.strokeStyle='#12306B';ctx.lineWidth=14;
      for(let i=0;i<4;i++){ctx.rotate(Math.PI/2);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-tile*0.16);ctx.stroke();
        ctx.beginPath();ctx.ellipse(0,-tile*0.11,tile*0.035,tile*0.075,0,0,7);ctx.stroke();}
      ctx.restore();
      // tulip motif
      ctx.save();ctx.translate(bx+tile*0.72,by+tile*0.3);
      ctx.fillStyle='#C4267E';
      ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(-tile*0.07,-tile*0.09,-tile*0.05,-tile*0.16,0,-tile*0.18);
      ctx.bezierCurveTo(tile*0.05,-tile*0.16,tile*0.07,-tile*0.09,0,0);ctx.fill();
      ctx.strokeStyle='#1E4FA3';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(-tile*0.02,tile*0.09,0,tile*0.16);ctx.stroke();
      ctx.restore();
      // canal house
      ctx.save();ctx.translate(bx+tile*0.24,by+tile*0.74);
      ctx.fillStyle='#1E4FA3';
      housePath(-tile*0.09,tile*0.12,tile*0.18,tile*0.24,(gx+gy)%3);ctx.fill();
      ctx.restore();
      // porcelain ring
      ctx.save();ctx.translate(bx+tile*0.73,by+tile*0.73);
      ctx.strokeStyle='#12306B';ctx.lineWidth=8;ctx.beginPath();ctx.arc(0,0,tile*0.11,0,7);ctx.stroke();
      ctx.strokeStyle='#29A8DF';ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,0,tile*0.085,0,7);ctx.stroke();
      ctx.restore();
      // scatter dots
      for(let k=0;k<14;k++){
        ctx.fillStyle=k%3?'#12306B':'#C4267E';
        const a=rr()*Math.PI*2;
        ctx.globalAlpha=0.5;
        ctx.beginPath();ctx.arc(bx+tile*0.5+Math.cos(a)*tile*0.42,by+tile*0.5+Math.sin(a)*tile*0.42,4+rr()*6,0,7);ctx.fill();
        ctx.globalAlpha=1;
      }
    }
  }
  drawMotifs(0,0);
  grain(0.03,88);
}

({delft,tulip,amsterdam,pattern})[piece]();
document.title='done-'+piece;
</script>
</body>
</html>
