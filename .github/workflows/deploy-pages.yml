name: Deploy naar GitHub Pages

# Zet de statische site (root van de repo) automatisch live op GitHub Pages.
# Draait op GitHub's eigen infrastructuur — onafhankelijk van de lokale omgeving.

on:
  push:
    branches: ["claude/ai-agent-business-course-RZJxN"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configureer Pages (en schakel in indien nodig)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site-artifact (hele repo-root)
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy naar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
